<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Benutzerverwaltung - StockMaster</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --accent: #7c3aed;
            --accent-blue: #1d4ed8;
            --bg: #09090b;
            --surface: rgba(30,41,59,0.7);
            --border: rgba(255,255,255,0.08);
            --text: #f4f4f5;
            --muted: #a1a1aa;
            --zinc-800: #27272a;
            --zinc-700: #3f3f46;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--zinc-700); border-radius: 3px; }

        /* Orbs */
        .orbs {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            animation: drift 18s ease-in-out infinite alternate;
        }
        .orb-1 { width: 500px; height: 500px; background: rgba(124,58,237,0.1); top: -100px; left: -100px; animation-duration: 20s; }
        .orb-2 { width: 400px; height: 400px; background: rgba(29,78,216,0.08); bottom: 0; right: -100px; animation-duration: 15s; animation-delay: -7s; }
        @keyframes drift {
            0%   { transform: translate(0,0) scale(1); }
            100% { transform: translate(40px,50px) scale(1.05); }
        }

        /* Header */
        header {
            position: relative;
            z-index: 10;
            background: rgba(9,9,11,0.8);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
        }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
            gap: 16px;
        }
        .logo-section { display: flex; align-items: center; gap: 12px; }
        .logo-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, rgba(124,58,237,0.3), rgba(29,78,216,0.3));
            border: 1px solid rgba(124,58,237,0.3);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
        }
        .brand h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .tagline { font-size: 12px; color: var(--muted); }
        .btn-header {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }
        .btn-header:hover { background: rgba(255,255,255,0.1); transform: translateY(-1px); }

        /* Main */
        main {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 2rem;
        }

        /* Card */
        .card {
            background: var(--surface);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 28px;
            border-bottom: 1px solid var(--border);
        }
        .card-header h2 { font-size: 20px; font-weight: 600; }
        .card-body { padding: 28px; }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #7c3aed, #1d4ed8);
            color: white;
            box-shadow: 0 4px 16px rgba(124,58,237,0.3);
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-secondary {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); }
        .btn-danger { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #f87171; }
        .btn-danger:hover { background: rgba(239,68,68,0.25); }
        .btn-sm { padding: 6px 12px; font-size: 12px; }

        /* Table */
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th {
            padding: 12px 16px;
            text-align: left;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 14px;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.02); }

        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-success { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.2); }
        .badge-muted { background: rgba(161,161,170,0.1); color: var(--muted); border: 1px solid rgba(161,161,170,0.1); }

        /* Alert */
        #alert-container { margin-bottom: 20px; }
        .alert {
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 14px;
            border: 1px solid;
            animation: slideDown 0.3s;
        }
        .alert-success { background: rgba(16,185,129,0.1); color: #34d399; border-color: rgba(16,185,129,0.2); }
        .alert-error { background: rgba(239,68,68,0.1); color: #f87171; border-color: rgba(239,68,68,0.2); }
        @keyframes slideDown { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }
        .empty-state svg { width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.4; }
        .empty-state p { font-size: 15px; }

        /* Actions */
        .actions { display: flex; gap: 6px; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            animation: fadeIn 0.2s;
        }
        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-content {
            background: #18181b;
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 90%;
            max-width: 480px;
            max-height: 90vh;
            overflow: hidden;
            animation: slideIn 0.2s;
            box-shadow: 0 24px 64px rgba(0,0,0,0.5);
        }
        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
        }
        .modal-header h3 { font-size: 17px; font-weight: 600; }
        .close {
            font-size: 22px;
            cursor: pointer;
            color: var(--muted);
            line-height: 1;
            transition: color 0.2s;
        }
        .close:hover { color: var(--text); }
        .modal-body {
            padding: 24px;
            overflow-y: auto;
            max-height: calc(90vh - 80px);
        }

        /* Form */
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 11px 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        .form-group input::placeholder { color: var(--zinc-700); }
        .form-group input:focus,
        .form-group select:focus {
            border-color: rgba(124,58,237,0.5);
            box-shadow: 0 0 0 3px rgba(124,58,237,0.1);
        }
        .form-group select option { background: #18181b; }
        .form-hint { font-size: 12px; color: var(--muted); margin-top: 5px; }
        .checkbox-row { display: flex; align-items: center; gap: 10px; }
        .checkbox-row input[type="checkbox"] {
            width: 16px; height: 16px;
            accent-color: var(--accent);
            cursor: pointer;
        }
        .checkbox-row label { margin: 0; font-size: 14px; color: var(--text); cursor: pointer; }
        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        @media (max-width: 640px) {
            .header-content { height: auto; padding: 12px 0; flex-wrap: wrap; }
            main { padding: 20px 1rem; }
            .card-body { padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <header>
        <div class="header-content">
            <div class="logo-section">
                <div class="logo-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                </div>
                <div class="brand">
                    <h1>Benutzerverwaltung</h1>
                    <p class="tagline">StockMaster Admin-Bereich</p>
                </div>
            </div>
            <a href="/" class="btn-header">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                Zurück
            </a>
        </div>
    </header>

    <main>
        <div id="alert-container"></div>

        <div class="card">
            <div class="card-header">
                <h2>Benutzer</h2>
                <button class="btn btn-primary" onclick="openUserModal()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Neuer Benutzer
                </button>
            </div>
            <div class="card-body">
                <div class="table-wrapper">
                    <div id="users-list"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- User Modal -->
    <div id="user-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Neuer Benutzer</h3>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="user-form" onsubmit="saveUser(event)">
                    <input type="hidden" id="user-id">

                    <div class="form-group">
                        <label>Benutzername *</label>
                        <input type="text" id="user-username" required minlength="3" placeholder="benutzername">
                    </div>

                    <div class="form-group">
                        <label>E-Mail *</label>
                        <input type="email" id="user-email" required placeholder="name@beispiel.de">
                    </div>

                    <div class="form-group" id="password-group">
                        <label id="password-label">Passwort *</label>
                        <input type="password" id="user-password" minlength="8" placeholder="Min. 8 Zeichen">
                        <p class="form-hint" id="password-hint">Min. 8 Zeichen, Groß-/Kleinbuchstaben + Zahl</p>
                    </div>

                    <div class="form-group">
                        <div class="checkbox-row">
                            <input type="checkbox" id="user-is-admin">
                            <label for="user-is-admin">Administrator-Rechte</label>
                        </div>
                        <p class="form-hint" style="margin-top: 6px;">Administratoren können Benutzer verwalten und alle Funktionen nutzen.</p>
                    </div>

                    <div class="modal-footer">
                        <button type="button" onclick="closeModal()" class="btn btn-secondary">Abbrechen</button>
                        <button type="submit" class="btn btn-primary" id="submit-btn">Benutzer erstellen</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadUsers();
        });

        async function loadUsers() {
            try {
                const response = await fetch('/api/users');
                if (!response.ok) throw new Error('Fehler beim Laden der Benutzer');
                const users = await response.json();
                displayUsers(users);
            } catch (error) {
                showAlert('Fehler beim Laden der Benutzer: ' + error.message, 'error');
            }
        }

        function displayUsers(users) {
            const container = document.getElementById('users-list');

            if (users.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                        <p>Keine Benutzer vorhanden</p>
                    </div>
                `;
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Benutzername</th>
                            <th>E-Mail</th>
                            <th>Admin</th>
                            <th>Erstellt am</th>
                            <th>Letzter Login</th>
                            <th>Aktionen</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            users.forEach(user => {
                const createdAt = user.created_at ? new Date(user.created_at).toLocaleDateString('de-DE') : '-';
                const lastLogin = user.last_login ? new Date(user.last_login).toLocaleString('de-DE') : 'Noch nie';

                html += `
                    <tr>
                        <td><strong>${user.username}</strong></td>
                        <td style="color: var(--muted)">${user.email || '-'}</td>
                        <td>
                            ${user.is_admin
                                ? '<span class="badge badge-success">Admin</span>'
                                : '<span class="badge badge-muted">Benutzer</span>'}
                        </td>
                        <td style="color: var(--muted)">${createdAt}</td>
                        <td style="color: var(--muted)">${lastLogin}</td>
                        <td>
                            <div class="actions">
                                <button onclick="editUser(${user.id})" class="btn btn-secondary btn-sm">Bearbeiten</button>
                                <button onclick="deleteUser(${user.id}, '${user.username}')" class="btn btn-danger btn-sm">Löschen</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        function openUserModal() {
            document.getElementById('modal-title').textContent = 'Neuer Benutzer';
            document.getElementById('submit-btn').textContent = 'Benutzer erstellen';
            document.getElementById('password-label').textContent = 'Passwort *';
            document.getElementById('password-hint').textContent = 'Mindestens 6 Zeichen';
            document.getElementById('user-password').required = true;
            document.getElementById('user-modal').classList.add('active');
            document.getElementById('user-form').reset();
            document.getElementById('user-id').value = '';
        }

        async function editUser(userId) {
            try {
                const response = await fetch(`/api/users/${userId}`);
                const user = await response.json();

                if (user) {
                    document.getElementById('modal-title').textContent = 'Benutzer bearbeiten';
                    document.getElementById('submit-btn').textContent = 'Änderungen speichern';
                    document.getElementById('password-label').textContent = 'Neues Passwort (optional)';
                    document.getElementById('password-hint').textContent = 'Leer lassen, um Passwort beizubehalten';
                    document.getElementById('user-password').required = false;

                    document.getElementById('user-id').value = user.id;
                    document.getElementById('user-username').value = user.username;
                    document.getElementById('user-email').value = user.email || '';
                    document.getElementById('user-is-admin').checked = user.is_admin;
                    document.getElementById('user-password').value = '';

                    document.getElementById('user-modal').classList.add('active');
                }
            } catch (error) {
                showAlert('Fehler beim Laden des Benutzers: ' + error.message, 'error');
            }
        }

        function closeModal() {
            document.getElementById('user-modal').classList.remove('active');
        }

        async function saveUser(event) {
            event.preventDefault();

            const userId = document.getElementById('user-id').value;
            const username = document.getElementById('user-username').value;
            const password = document.getElementById('user-password').value;
            const email = document.getElementById('user-email').value;
            const isAdmin = document.getElementById('user-is-admin').checked;

            if (!email) {
                showAlert('E-Mail ist erforderlich', 'error');
                return;
            }
            if (!userId && !password) {
                showAlert('Passwort ist erforderlich für neue Benutzer', 'error');
                return;
            }

            try {
                const csrfToken = document.querySelector('meta[name="csrf-token"]').content;
                const url = userId ? `/api/users/${userId}` : '/api/users';
                const method = userId ? 'PUT' : 'POST';

                const body = { username, email: email || null, is_admin: isAdmin };
                if (password) body.password = password;

                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                    body: JSON.stringify(body)
                });

                const result = await response.json();

                if (result.success) {
                    showAlert(userId ? 'Benutzer erfolgreich aktualisiert!' : 'Benutzer erfolgreich erstellt!', 'success');
                    closeModal();
                    loadUsers();
                } else {
                    showAlert(result.message, 'error');
                }
            } catch (error) {
                showAlert('Fehler beim Speichern des Benutzers: ' + error.message, 'error');
            }
        }

        async function deleteUser(userId, username) {
            if (!confirm(`Möchten Sie den Benutzer "${username}" wirklich löschen?`)) return;

            try {
                const csrfToken = document.querySelector('meta[name="csrf-token"]').content;
                const response = await fetch(`/api/users/${userId}`, {
                    method: 'DELETE',
                    headers: { 'X-CSRFToken': csrfToken }
                });

                const result = await response.json();

                if (result.success) {
                    showAlert('Benutzer erfolgreich gelöscht!', 'success');
                    loadUsers();
                } else {
                    showAlert(result.message, 'error');
                }
            } catch (error) {
                showAlert('Fehler beim Löschen des Benutzers: ' + error.message, 'error');
            }
        }

        function showAlert(message, type = 'success') {
            const container = document.getElementById('alert-container');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            container.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }

        window.onclick = function(event) {
            const modal = document.getElementById('user-modal');
            if (event.target === modal) closeModal();
        }
    </script>
</body>
</html>
