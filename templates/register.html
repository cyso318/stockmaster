<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Registrieren - StockMaster</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #09090b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        ::selection { background: rgba(139, 92, 246, 0.4); }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 9999px; }

        .bg-orb { position:fixed; border-radius:9999px; filter:blur(120px); pointer-events:none; z-index:0; }
        .bg-orb-violet { width:600px; height:600px; background:#7c3aed; opacity:0.15; top:-10%; left:-10%; animation:orb1 22s ease-in-out infinite alternate; }
        .bg-orb-blue   { width:600px; height:600px; background:#1d4ed8; opacity:0.12; bottom:-15%; right:-10%; animation:orb2 28s ease-in-out infinite alternate; }
        @keyframes orb1 { 0%{transform:translate(0,0)} 100%{transform:translate(18vw,5vh)} }
        @keyframes orb2 { 0%{transform:translate(0,0)} 100%{transform:translate(-8vw,-15vh)} }
        .reg-wrap { position:relative; z-index:1; width:100%; display:flex; align-items:center; justify-content:center; }

        .register-container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
            max-width: 420px;
            width: 100%;
            padding: 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo a {
            font-size: 24px;
            font-weight: 700;
            text-decoration: none;
            background: linear-gradient(135deg, #a78bfa, #1d4ed8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 30px;
            text-align: center;
            color: #f4f4f5;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            color: #a1a1aa;
            transition: all 0.3s;
            font-size: 13px;
        }

        .tab.active {
            background: linear-gradient(135deg, #7c3aed, #1d4ed8);
            color: white;
            border-color: transparent;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.2);
        }

        .tab:hover:not(.active) {
            background: rgba(255, 255, 255, 0.05);
            color: #f4f4f5;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #a1a1aa;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.04);
            color: #f4f4f5;
            transition: all 0.3s;
        }

        .form-group input::placeholder {
            color: #71717a;
        }

        .form-group input:focus {
            outline: none;
            border-color: #a78bfa;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
            background: rgba(15, 23, 42, 0.7);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-left: 4px solid;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            border-color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-left: 4px solid #10b981;
        }

        .alert-error {
            background: rgba(244, 63, 94, 0.1);
            color: #fb7185;
            border-color: #f43f5e;
            border: 1px solid rgba(244, 63, 94, 0.2);
            border-left: 4px solid #f43f5e;
        }

        .alert.show {
            display: block;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #7c3aed, #1d4ed8);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(124, 58, 237, 0.4);
            filter: brightness(1.08);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: rgba(255, 255, 255, 0.05);
            box-shadow: none;
            cursor: not-allowed;
            filter: none;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #a1a1aa;
            font-size: 14px;
        }

        .login-link a {
            color: #a78bfa;
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="bg-orb bg-orb-violet" aria-hidden="true"></div>
    <div class="bg-orb bg-orb-blue" aria-hidden="true"></div>
    <div class="reg-wrap">
    <div class="register-container">
        <div class="logo">
            <a href="/">StockMaster</a>
        </div>

        <h2>Registrieren</h2>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('org')">Neue Organisation</div>
            <div class="tab" onclick="switchTab('user')">Benutzer hinzufügen</div>
        </div>

        <div id="alert" class="alert"></div>

        <!-- Tab 1: Neue Organisation erstellen -->
        <div id="org-tab" class="tab-content active">
            <form id="org-form">
                <div class="form-group">
                    <label>Organisationsname</label>
                    <input type="text" id="org-name" name="org_name" required placeholder="Meine Firma">
                </div>

                <div class="form-group">
                    <label>E-Mail (Admin)</label>
                    <input type="email" id="org-email" name="email" required placeholder="admin@firma.de">
                </div>

                <div class="form-group">
                    <label>Admin-Benutzername</label>
                    <input type="text" id="org-username" name="username" required placeholder="admin">
                </div>

                <div class="form-group">
                    <label>Passwort</label>
                    <input type="password" id="org-password" name="password" required minlength="8" placeholder="Min. 8 Zeichen">
                </div>

                <button type="submit" class="btn" id="org-submit-btn">
                    Organisation erstellen
                </button>
            </form>
        </div>

        <!-- Tab 2: Benutzer zu bestehender Organisation -->
        <div id="user-tab" class="tab-content">
            <form id="user-form">
                <div class="form-group">
                    <label>Einladungscode</label>
                    <input type="text" id="user-invitation-token" name="invitation_token" required placeholder="z.B. xY3k9mP2vL8" autocomplete="off">
                    <div style="font-size: 12px; color: #71717a; margin-top: 6px;">
                        🔐 Den Einladungscode erhalten Sie vom Administrator Ihrer Organisation.<br>
                        Jeder Code kann nur einmal verwendet werden.
                    </div>
                </div>

                <div id="org-name-display" style="display: none; padding: 12px; background: rgba(29, 78, 216, 0.08); border: 1px solid rgba(29, 78, 216, 0.2); border-radius: 10px; margin-bottom: 16px;">
                    <div style="font-size: 13px; color: #38bdf8;">
                        <strong>Organisation:</strong> <span id="org-name-text">-</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>E-Mail</label>
                    <input type="email" id="user-email" name="email" required placeholder="name@firma.de">
                </div>

                <div class="form-group">
                    <label>Benutzername</label>
                    <input type="text" id="user-username" name="username" required placeholder="benutzername">
                </div>

                <div class="form-group">
                    <label>Passwort</label>
                    <input type="password" id="user-password" name="password" required minlength="8" placeholder="Min. 8 Zeichen">
                </div>

                <button type="submit" class="btn" id="user-submit-btn">
                    Benutzer registrieren
                </button>
            </form>
        </div>

        <div class="login-link">
            Bereits registriert? <a href="/login">Anmelden</a>
        </div>
    </div>

    <script>
        const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content;
        const alertDiv = document.getElementById('alert');

        function showAlert(message, type = 'error') {
            alertDiv.textContent = message;
            alertDiv.className = `alert alert-${type} show`;
        }

        function switchTab(tab) {
            // Update tabs
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));

            if (tab === 'org') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('org-tab').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('user-tab').classList.add('active');
            }

            alertDiv.className = 'alert';
        }

        // Form 1: Organisation erstellen
        document.getElementById('org-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                type: 'organization',
                org_name: document.getElementById('org-name').value,
                email: document.getElementById('org-email').value,
                username: document.getElementById('org-username').value,
                password: document.getElementById('org-password').value
            };

            const submitBtn = document.getElementById('org-submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Wird erstellt...';

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (result.success) {
                    showAlert('Organisation erfolgreich erstellt!', 'success');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1500);
                } else {
                    showAlert(result.message || 'Fehler bei der Registrierung');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Organisation erstellen';
                }
            } catch (error) {
                showAlert('Fehler. Bitte erneut versuchen.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Organisation erstellen';
            }
        });

        // Token-Validierung bei Eingabe
        const tokenInput = document.getElementById('user-invitation-token');
        let validationTimeout;

        tokenInput?.addEventListener('input', function() {
            clearTimeout(validationTimeout);
            const token = this.value.trim();

            if (token.length < 6) {
                document.getElementById('org-name-display').style.display = 'none';
                return;
            }

            validationTimeout = setTimeout(async () => {
                try {
                    const response = await fetch('/api/invitations/validate', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ token })
                    });

                    const result = await response.json();

                    if (result.valid) {
                        document.getElementById('org-name-text').textContent = result.organization_name;
                        document.getElementById('org-name-display').style.display = 'block';
                    } else {
                        document.getElementById('org-name-display').style.display = 'none';
                    }
                } catch (error) {
                    document.getElementById('org-name-display').style.display = 'none';
                }
            }, 500);
        });

        // Form 2: Benutzer hinzufügen
        document.getElementById('user-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                type: 'user',
                invitation_token: document.getElementById('user-invitation-token').value,
                email: document.getElementById('user-email').value,
                username: document.getElementById('user-username').value,
                password: document.getElementById('user-password').value
            };

            const submitBtn = document.getElementById('user-submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Wird erstellt...';

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (result.success) {
                    showAlert('Benutzer erfolgreich registriert!', 'success');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1500);
                } else {
                    showAlert(result.message || 'Fehler bei der Registrierung');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Benutzer registrieren';
                }
            } catch (error) {
                showAlert('Fehler. Bitte erneut versuchen.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Benutzer registrieren';
            }
        });
    </script>
    </div><!-- /.reg-wrap -->
</body>
</html>
