<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StockMaster</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #09090b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        ::selection { background: rgba(139, 92, 246, 0.4); }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 9999px; }

        .bg-orb {
            position: fixed; border-radius: 9999px; filter: blur(120px);
            pointer-events: none; z-index: 0;
        }
        .bg-orb-violet { width:600px; height:600px; background:#7c3aed; opacity:0.15;
            top:-10%; left:-10%; animation: orb1 22s ease-in-out infinite alternate; }
        .bg-orb-blue   { width:600px; height:600px; background:#1d4ed8; opacity:0.12;
            bottom:-15%; right:-10%; animation: orb2 28s ease-in-out infinite alternate; }
        @keyframes orb1 { 0%{transform:translate(0,0)} 100%{transform:translate(18vw,5vh)} }
        @keyframes orb2 { 0%{transform:translate(0,0)} 100%{transform:translate(-8vw,-15vh)} }

        .login-wrap { position: relative; z-index: 1; width: 100%; display: flex; align-items: center; justify-content: center; }

        .login-container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.3), rgba(29, 78, 216, 0.2));
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            color: #f4f4f5;
            padding: 40px 30px;
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #7c3aed, #1d4ed8);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 0 24px rgba(124, 58, 237, 0.3);
        }

        .logo svg {
            width: 50px;
            height: 50px;
        }

        .login-header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #1d4ed8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-header p {
            font-size: 14px;
            color: #a1a1aa;
        }

        .login-body {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #a1a1aa;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.04);
            color: #f4f4f5;
        }

        .form-group input::placeholder {
            color: #71717a;
        }

        .form-group input:focus {
            outline: none;
            border-color: #a78bfa;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
            background: rgba(15, 23, 42, 0.7);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 14px;
            color: #a1a1aa;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #a1a1aa;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #a78bfa;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #7c3aed, #1d4ed8);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.3);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(124, 58, 237, 0.4);
            filter: brightness(1.08);
        }

        .btn-login:active {
            transform: translateY(0);
            filter: brightness(0.95);
        }

        .error-message {
            background: rgba(244, 63, 94, 0.1);
            color: #fb7185;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(244, 63, 94, 0.25);
            border-left: 4px solid #f43f5e;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-box {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .info-box h3 {
            font-size: 14px;
            color: #f4f4f5;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .info-box p {
            font-size: 13px;
            color: #a1a1aa;
            line-height: 1.6;
        }

        .info-box code {
            background: rgba(124, 58, 237, 0.12);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #a78bfa;
            border: 1px solid rgba(124, 58, 237, 0.2);
        }

        @media (max-width: 480px) {
            .login-container {
                border-radius: 16px;
            }

            .login-header {
                padding: 30px 20px;
            }

            .login-body {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-orb bg-orb-violet" aria-hidden="true"></div>
    <div class="bg-orb bg-orb-blue" aria-hidden="true"></div>
    <div class="login-wrap">
    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <svg viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="5" y="5" width="40" height="40" rx="8" fill="white" fill-opacity="0.3"/>
                    <path d="M15 20h20M15 25h20M15 30h15" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                    <circle cx="35" cy="35" r="8" fill="white"/>
                    <path d="M32 35h6M35 32v6" stroke="#667eea" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
            </div>
            <h1>StockMaster</h1>
            <p>Intelligente Lagerverwaltung</p>
        </div>

        <div class="login-body">
            {% if error %}
            <div class="error-message">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="form-group">
                    <label for="email">E-Mail</label>
                    <input type="email" id="email" name="email" required autofocus autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Passwort</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="remember-forgot">
                    <label class="remember-me">
                        <input type="checkbox" name="remember" id="remember">
                        <span>Angemeldet bleiben</span>
                    </label>
                </div>

                <button type="submit" class="btn-login">Anmelden</button>
            </form>

            <div style="text-align: center; margin-top: 24px; font-size: 14px; color: #a1a1aa;">
                <p>Noch kein Konto? <a href="/register" style="color: #a78bfa; text-decoration: none; font-weight: 500;">Registrieren</a></p>
            </div>
        </div>
    </div>
    </div><!-- /.login-wrap -->
</body>
</html>
