<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockMaster</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #09090b;
            color: #f4f4f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 340px;
            text-align: center;
        }
        h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
        p { font-size: 14px; color: #52525b; margin-bottom: 28px; }
        .btn {
            display: block;
            width: 100%;
            padding: 11px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.15s;
        }
        .btn-primary { background: #7c3aed; color: #fff; margin-bottom: 8px; }
        .btn-primary:hover { background: #6d28d9; }
        .btn-secondary { background: #27272a; color: #f4f4f5; }
        .btn-secondary:hover { background: #3f3f46; }
        footer { margin-top: 24px; display: flex; justify-content: center; gap: 16px; }
        footer a { font-size: 12px; color: #3f3f46; text-decoration: none; }
        footer a:hover { color: #71717a; }
    </style>
</head>
<body>
    <div>
        <div class="card">
            <h1>StockMaster</h1>
            <p>Lagerverwaltung</p>
            <a href="/login" class="btn btn-primary">Anmelden</a>
            <a href="/register" class="btn btn-secondary">Registrieren</a>
        </div>
        <footer>
            <a href="/impressum">Impressum</a>
            <a href="/datenschutz">Datenschutz</a>
            <a href="/agb">AGB</a>
        </footer>
    </div>
</body>
</html>
